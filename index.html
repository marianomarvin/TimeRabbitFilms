:root{--red:#E61A33;--wine:#73030D;--white:#F2F2F2;--grey:#8C8C8C;--black:#0D0D0D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
h1,h2,h3,.logo,.cats a,.facts b{font-synthesis:none}
button,input,select,textarea{letter-spacing:inherit}
body{letter-spacing:.05em;margin:0;background:var(--black);color:var(--white);font:400 1.05rem/1.6 "Creato Display",system-ui,sans-serif}
h1,h2,h3{font-family:"Ge Body","Creato Display",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(13,13,13,.94);border-bottom:1px solid var(--wine);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem clamp(1rem,4vw,3rem);flex-wrap:wrap}
.logo{font-family:"Ge Body","Creato Display",Georgia,serif;font-weight:400;font-size:1.4rem;text-decoration:none;display:flex;align-items:center;gap:.6rem}
.logo img{width:46px;height:46px;mix-blend-mode:lighten;display:block}
.hero{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:2rem;align-items:center}
.hero img{width:100%;height:auto;mix-blend-mode:lighten;display:block;order:-1}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero img{max-width:300px;order:-1}}
nav{display:flex;gap:1.4rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--grey);padding:.2rem 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover,nav a[aria-current=page]{color:var(--white);border-color:var(--red)}
.burger{display:none;appearance:none;background:none;border:1px solid var(--wine);width:2.8rem;height:2.8rem;padding:0;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.burger span{display:block;width:1.4rem;height:2px;background:var(--white);transition:transform .25s,opacity .2s}
header.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
header.open .burger span:nth-child(2){opacity:0}
header.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:760px){
  header{flex-wrap:nowrap}
  .burger{display:flex}
  nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--black);border-bottom:1px solid var(--wine);flex-direction:column;gap:0;padding:.4rem clamp(1rem,4vw,3rem) 1rem}
  header.open nav{display:flex}
  nav a{padding:.9rem 0;font-size:1.1rem;border-bottom:1px solid #1e1e1e}
}
main{min-height:70vh}
.wrap{padding:clamp(2rem,6vw,5rem) clamp(1rem,4vw,3rem);max-width:1200px;margin:0 auto}
.hero{padding:clamp(2.5rem,7vw,6rem) clamp(1rem,4vw,3rem) 2rem;max-width:1200px;margin:0 auto}
.hero h1{font-size:clamp(2.8rem,10vw,7.5rem);font-weight:400;line-height:1.3}
.hero h1 span{display:block;color:var(--red)}
.hero p{max-width:34rem;color:var(--grey);margin:1.5rem 0 0}
.video{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--wine),var(--black) 70%);border:1px solid var(--wine);display:grid;place-items:center;width:100%;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{appearance:none;border:0;cursor:pointer;background:var(--red);color:var(--white);width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;transition:transform .2s,background .2s}
.play:hover{background:var(--white);color:var(--red);transform:scale(1.08)}
.play svg{width:1.8rem;height:1.8rem;margin-left:.2rem}
.video small{position:absolute;left:1rem;bottom:.8rem;color:var(--grey)}
.play,.play:hover{background:none;color:inherit;transform:none;transition:none;padding:0;width:5.5rem;height:5.5rem}
.play img{width:100%;height:100%;display:block}
.thumb{transition:border-color .2s,opacity .6s ease}
@media(hover:hover){
.thumbs:has(.thumb:hover) .thumb:not(:hover){opacity:.4;transition:border-color .2s,opacity 2s ease}
.wrap:has(#player:hover) .thumb{opacity:.4;transition:border-color .2s,opacity 2s ease}
}
@media(prefers-reduced-motion:reduce){.thumb,.thumbs:has(.thumb:hover) .thumb:not(:hover),.wrap:has(#player:hover) .thumb{transition:border-color .2s}}
.swap{display:grid;place-items:center;position:relative;z-index:1;width:1.9rem;height:1.9rem}
.swap>*{grid-area:1/1;transition:opacity .2s}
.pswap{display:grid;width:100%;height:100%}
.pswap>*{grid-area:1/1;transition:opacity .2s}
.pswap svg{width:100%;height:100%;box-sizing:border-box;padding:1.7rem 1.6rem 1.7rem 1.9rem;background:var(--white);color:var(--red);border-radius:50%;opacity:0;margin:0}
.video:hover .pswap img,.play:focus-visible .pswap img{opacity:0}
.video:hover .pswap svg,.play:focus-visible .pswap svg{opacity:1}
@media(prefers-reduced-motion:reduce){.pswap>*{transition:none}}
.thumb-eye{width:1.9rem;height:1.9rem;display:block}
.thumb .swap svg{opacity:0}
.thumb:hover .thumb-eye,.thumb:focus-visible .thumb-eye{opacity:0}
.thumb:hover .swap svg,.thumb:focus-visible .swap svg{opacity:1}
@media(prefers-reduced-motion:reduce){.swap>*{transition:none}}

const $app = document.getElementById("app");

const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';

function toEmbed(u){
  const m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  if(m) return "https://www.youtube.com/embed/"+m[1];
  const v = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return v ? "https://player.vimeo.com/video/"+v[1] : u;
}
function poster(u,q){
  const m = (u||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);
  const v = (u||"").match(/vimeo\.com\/(?:video\/)?(\d+)/);
  const src = m ? `https://i.ytimg.com/vi/${m[1]}/${q}default.jpg` : v ? `https://vumbnail.com/${v[1]}.jpg` : "";
  return src ? `<img class="poster" src="${src}" alt="" loading="lazy" onerror="this.remove()">` : "";
}
function video(url,label){
  const orig = url; url = toEmbed(url);
  const yt = url ? `<p class="ytl">Si la vidéo ne s'affiche pas : <a href="${orig.includes("/embed/")?orig.replace("/embed/","/watch?v="):orig}" target="_blank" rel="noopener">ouvrir sur ${/vimeo/.test(orig)?"Vimeo":"YouTube"} ↗</a></p>` : "";
  const id = "v"+Math.random().toString(36).slice(2,8);
  if(!url) return `<div class="video" role="img" aria-label="Vidéo à venir : ${label}"><button class="play" disabled aria-label="Vidéo bientôt disponible" style="opacity:.5;cursor:default"><img src="${EYE}" alt=""></button><small>Vidéo bientôt disponible</small></div>`;
  return `<div class="video" id="${id}">${poster(orig,"hq")}<button class="play" data-src="${url}" data-t="${label}" aria-label="Lire : ${label}"><i class="pswap"><img src="${EYE}" alt="">${PLAY}</i></button></div>${yt}`;
}

  <div class="two"><div>
  <p>Time Rabbit Films regroupe les productions vidéo de Robby Pepe, qui filme ce qui compte : un mariage, un concert, un match, la vie d'une entreprise ou un projet de cinéma, pour obtenir de l'argent et payer de la viande ou des Blu-ray à son CEO.</p>
  <p>Chaque projet commence par une conversation autour d'un burger. Je définis avec vous l'histoire à raconter, puis je m'occupe du tournage, du montage, de l'étalonnage et du son, et Marvin, que je sous-paie, des titrages, parce que je suis nul en titrage.</p>
  <p>Pendant que je filme vos mariages, je ne réalise pas mon court métrage, alors pitié, faites vite, dites-vous oui, et je dérushe sur place, vous fais le montage au matin, la tête dans le cul, et vous le renvoie presque avant la fin du mariage, comme Jason.</p>
  </div><div><figure class="photo"><img src="${ROBBY}" alt="Robby, vidéaste, tenant une caméra sur stabilisateur" width="900" height="600"><figcaption>Robby</figcaption></figure><div class="facts">
  <div><b>13 univers</b><span>du mariage au documentaire</span></div>
  <div><b>De A à Z</b><span>tournage, montage, étalonnage, son</span></div>
  <div><b>Partout</b><span>en Belgique et à l'étranger</span></div>
  </div></div></div></div>`;
}

function contact(){
  return `<div class="wrap"><h2>Contact</h2><hr class="rule">
  <div class="contact-info"><p style="max-width:50ch">Une idée, une date, un projet ? Écrivez-moi, je vous réponds rapidement.</p>
  <p><a class="cta" href="mailto:${EMAIL}">${EMAIL}</a></p></div></div>`;
}

function route(){
  const [path,qs] = (location.hash.slice(2)||"").split("?");
  const [page,arg] = path.split("/");
  const p = page||"home";
  let html;
  if(p==="portfolio") html = portfolio(arg);
  else if(p==="photos") html = photos();
  else if(p==="presentation") html = presentation();
  else if(p==="contact") html = contact(new URLSearchParams(qs||"").get("s"));
  else html = home();
  $app.innerHTML = html;
  document.querySelectorAll("nav a").forEach(a=>{
    a.toggleAttribute("aria-current",a.dataset.p===p);
    if(a.dataset.p===p) a.setAttribute("aria-current","page");
  });
  window.scrollTo(0,0);
  document.title = "Time Rabbit Films — " + (p==="home"?"Vidéaste":p[0].toUpperCase()+p.slice(1));
}

function setPlayer(cid,i){
  const c = CATEGORIES.find(x=>x.id===cid), k = i===null ? null : c.clips[i];
  const url = k ? k.url : c.url, label = k ? k.t+" — "+c.name : "Showreel "+c.name;
  const pl = document.getElementById("player");
  pl.innerHTML = video(url,label);
  const b = pl.querySelector(".play[data-src]");
  if(b) b.click();
  document.querySelectorAll(".thumb").forEach((t,n)=>t.setAttribute("aria-pressed",String(n===i)));
  document.getElementById("back").classList.toggle("on",i!==null);
}
document.addEventListener("click",e=>{
  const t = e.target.closest(".thumb");
  if(t){ setPlayer(t.dataset.c,+t.dataset.i); return; }
  if(e.target.closest("#back")){ setPlayer(e.target.closest("#back").dataset.c,null); return; }
  const b = e.target.closest(".play[data-src]");
  if(!b) return;
  const box = b.parentElement;
  box.innerHTML = `<iframe src="${b.dataset.src}?autoplay=1" title="${b.dataset.t}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
});


const hd = document.querySelector("header"), bg = document.getElementById("burger");
function menu(open){ hd.classList.toggle("open",open); bg.setAttribute("aria-expanded",String(open)); bg.setAttribute("aria-label",open?"Fermer le menu":"Ouvrir le menu"); }
bg.addEventListener("click",()=>menu(!hd.classList.contains("open")));
document.getElementById("nav").addEventListener("click",e=>{ if(e.target.closest("a")) menu(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") menu(false); });
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
