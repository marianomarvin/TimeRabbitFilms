:root{--red:#E61A33;--wine:#73030D;--white:#F2F2F2;--grey:#8C8C8C;--black:#0D0D0D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
h1,h2,h3,.logo,.cats a,.facts b{font-synthesis:none}
body{margin:0;background:var(--black);color:var(--white);font:400 1.05rem/1.6 "Creato Display",system-ui,sans-serif}
h1,h2,h3{font-family:"Ge Body","Creato Display",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(13,13,13,.94);border-bottom:1px solid var(--wine);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem clamp(1rem,4vw,3rem);flex-wrap:wrap}
.logo{font-family:"Ge Body","Creato Display",Georgia,serif;font-weight:400;font-size:1.4rem;text-decoration:none;display:flex;align-items:center;gap:.6rem}
.logo img{width:46px;height:46px;mix-blend-mode:lighten;display:block}
.hero{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:2rem;align-items:center}
.hero img{width:100%;height:auto;mix-blend-mode:lighten;display:block;order:-1}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero img{max-width:300px;order:-1}}
nav{display:flex;gap:1.4rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--grey);padding:.2rem 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover,nav a[aria-current=page]{color:var(--white);border-color:var(--red)}
main{min-height:70vh}
.wrap{padding:clamp(2rem,6vw,5rem) clamp(1rem,4vw,3rem);max-width:1200px;margin:0 auto}
.hero{padding:clamp(2.5rem,7vw,6rem) clamp(1rem,4vw,3rem) 2rem;max-width:1200px;margin:0 auto}
.hero h1{font-size:clamp(2.8rem,10vw,7.5rem);font-weight:400;line-height:1.3}
.hero h1 span{display:block;color:var(--red)}
.hero p{max-width:34rem;color:var(--grey);margin:1.5rem 0 0}
.video{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--wine),var(--black) 70%);border:1px solid var(--wine);display:grid;place-items:center;width:100%;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{appearance:none;border:0;cursor:pointer;background:var(--red);color:var(--white);width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;transition:transform .2s,background .2s}
.play:hover{background:var(--white);color:var(--red);transform:scale(1.08)}
.play svg{width:1.8rem;height:1.8rem;margin-left:.2rem}
.video small{position:absolute;left:1rem;bottom:.8rem;color:var(--grey)}
.ytl{margin:.5rem 0 0;font-size:.85rem;color:var(--grey)}.ytl a{color:var(--white)}
.reel{padding:0 clamp(1rem,4vw,3rem);max-width:1200px;margin:0 auto}
h2{font-size:clamp(2rem,5vw,3.4rem)}
.rule{width:4rem;height:4px;background:var(--red);margin:1rem 0 2rem;border:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--wine);border:1px solid var(--wine);margin-top:2rem}
.cats a{background:var(--black);padding:1.6rem 1.2rem;text-decoration:none;font-family:"Creato Display",system-ui,sans-serif;font-weight:700;font-size:1.25rem;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.cats a:hover{background:var(--red)}
.cats a span{font:400 .9rem "Creato Display",sans-serif;color:var(--grey);text-transform:none}
.cats a:hover span{color:var(--white)}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.tabs a{text-decoration:none;border:1px solid var(--grey);color:var(--grey);padding:.3rem .8rem;border-radius:2rem;font-size:.8rem;font-family:"Creato Display",system-ui,sans-serif;font-weight:700;text-transform:capitalize;font-variant:normal;transition:all .2s}
.tabs a:hover{color:var(--white);border-color:var(--white)}
.tabs a[aria-current=page]{background:var(--red);border-color:var(--red);color:var(--white)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.8rem}
.thumb{appearance:none;cursor:pointer;aspect-ratio:16/9;background:linear-gradient(135deg,var(--wine),var(--black) 75%);border:1px solid var(--wine);color:var(--white);font:500 .85rem "Creato Display",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;padding:.4rem;transition:border-color .2s,transform .2s}
.thumb svg{width:1.3rem;height:1.3rem;color:var(--red);background:var(--white);border-radius:50%;padding:.3rem;box-sizing:content-box}
.thumb:hover{border-color:var(--white);transform:translateY(-2px)}
.thumb[aria-pressed=true]{border:2px solid var(--red)}
.back{background:none;border:0;color:var(--grey);font:inherit;font-size:.9rem;cursor:pointer;padding:.5rem 0;text-decoration:underline;display:none}
.back.on{display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:start}
.two p{max-width:60ch;margin:0 0 1rem}
.facts{border-left:4px solid var(--red);padding-left:1.5rem;display:grid;gap:1.4rem}
.facts b{font-family:"Ge Body","Creato Display",Georgia,serif;font-weight:400;font-size:1.6rem;display:block}
.facts span{color:var(--grey)}
form{display:grid;gap:1.1rem;max-width:36rem}
label{display:grid;gap:.35rem;color:var(--grey);font-size:.95rem}
input,select,textarea{font:inherit;color:var(--white);background:var(--black);border:1px solid var(--grey);padding:.75rem .9rem;border-radius:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:2px solid var(--red)}
button.cta,a.cta{display:inline-block;width:fit-content;background:var(--red);color:var(--white);border:0;padding:.9rem 2rem;font:600 1rem "Creato Display",sans-serif;cursor:pointer;text-decoration:none;transition:background .2s}
button.cta:hover,a.cta:hover{background:var(--wine)}
.contact-info{color:var(--grey)}.contact-info a{color:var(--white)}
footer{border-top:1px solid var(--wine);padding:2rem clamp(1rem,4vw,3rem);color:var(--grey);display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-size:.9rem}
.hero h1{font-family:Gontserrat,"Creato Display",system-ui,sans-serif;font-weight:500;font-size:clamp(1.9rem,6.5vw,4.4rem);line-height:1.2;letter-spacing:.02em}
.hero h1{color:var(--red)}
.hero h1 span{font-weight:300;letter-spacing:.01em;color:var(--white)}
h2,h3,.facts b{font-family:Gontserrat,"Creato Display",system-ui,sans-serif;font-weight:500;letter-spacing:.01em}
h2{font-size:clamp(1.8rem,4.5vw,2.8rem)}
.facts b{font-size:1.35rem}
.hero h1{transform:scaleX(.95);transform-origin:left center;position:relative;top:2px}
.hero p{color:#BFBFBF}
.logo{font-family:Gontserrat,"Creato Display",system-ui,sans-serif;font-weight:500;font-size:1.05rem;letter-spacing:.04em}
.lt{color:var(--red)}
.lt em{font-style:normal;font-weight:300;color:var(--white)}
.hero h1{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@media(max-width:760px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>

  mariage:{show:"",clips:["https://www.youtube.com/watch?v=hnVF5fCbpMw","https://www.youtube.com/watch?v=ndkzKohHcDQ","https://www.youtube.com/watch?v=-tyk24wdScs"]},
  corporate:{show:"",clips:["https://www.youtube.com/watch?v=DupDLsXKDCU"]},
  cinema:{show:"",clips:["https://www.youtube.com/watch?v=9ICplUnRR7w"]},
  documentaires:{show:"https://www.youtube.com/watch?v=5GxjqObGTAM",clips:["https://www.youtube.com/watch?v=NMBfE7My93U","https://www.youtube.com/watch?v=0miqsdHJS1o","https://www.youtube.com/watch?v=G3dPgGZGu2Q"]}
};
Object.entries(LINKS).forEach(([id,o])=>{
  const c = CATEGORIES.find(x=>x.id===id);
  if(o.show) c.url = o.show;
  o.clips.forEach((u,i)=>{ c.clips[i].url = u; });
});
/* ================================== */

const $app = document.getElementById("app");
document.getElementById("hl").src = LOGO;
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';

function toEmbed(u){
  const m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  return m ? "https://www.youtube.com/embed/"+m[1] : u;
}
function video(url,label){
  const orig = url; url = toEmbed(url);
  const yt = url ? `<p class="ytl">Si la vidéo ne s'affiche pas : <a href="${orig.includes("/embed/")?orig.replace("/embed/","/watch?v="):orig}" target="_blank" rel="noopener">ouvrir sur YouTube ↗</a></p>` : "";
  const id = "v"+Math.random().toString(36).slice(2,8);
  if(!url) return `<div class="video" role="img" aria-label="Vidéo à venir : ${label}"><button class="play" disabled aria-label="Vidéo bientôt disponible" style="opacity:.5;cursor:default">${PLAY}</button><small>${label} — vidéo bientôt disponible</small></div>`;
  return `<div class="video" id="${id}"><button class="play" data-src="${url}" data-t="${label}" aria-label="Lire : ${label}">${PLAY}</button><small>${label}</small></div>${yt}`;
}

function home(){
  return `<section class="hero"><div><h1>TIME RABBIT<span>Films</span></h1>
  <p>Réalisateur.<br>Vidéaste pour vos mariages, concerts, vos évènements en sport, entreprises, culture et cinéma.</p></div><img src="${LOGO}" alt="Logo Time Rabbit Video Productions"></section>
  <section class="reel">${video(GENERAL,"Showreel général")}
  <div class="cats" role="list">${CATEGORIES.map(c=>`<a role="listitem" href="#/portfolio/${c.id}">${c.name}<span>Voir</span></a>`).join("")}</div></section>
  <div class="wrap"><a class="cta" href="#/contact">Parlons de votre projet</a></div>`;
}

function portfolio(id){
  const cur = CATEGORIES.find(c=>c.id===id) || CATEGORIES[0];
  return `<div class="wrap"><h2>Réalisations</h2><hr class="rule">
  <div class="tabs">${CATEGORIES.map(c=>`<a href="#/portfolio/${c.id}" ${c.id===cur.id?'aria-current="page"':''}>${c.name}</a>`).join("")}</div>
  <h3 style="font-size:1.6rem;margin-bottom:1rem">${cur.name}</h3>
  <div id="player">${video(cur.url,"Showreel "+cur.name)}</div>
  <button class="back" id="back" data-c="${cur.id}">← Revenir au showreel ${cur.name}</button>
  <div class="thumbs" role="group" aria-label="Autres vidéos ${cur.name}">${cur.clips.map((k,i)=>`<button class="thumb" aria-pressed="false" data-c="${cur.id}" data-i="${i}" aria-label="Lire : ${k.t}">${PLAY}${k.t}</button>`).join("")}</div>
  <p style="max-width:60ch;color:var(--grey);margin-top:1.5rem">${cur.txt}</p>
  <a class="cta" href="#/contact?s=${cur.id}">Un projet ${cur.name.toLowerCase()} ?</a></div>`;
}

function presentation(){
  return `<div class="wrap"><h2>Présentation</h2><hr class="rule">
  <div class="two"><div>
  <p>Time Rabbit Films est une structure de production vidéo qui filme ce qui compte : un mariage, un concert, un match, la vie d'une entreprise ou un projet de cinéma.</p>
  <p>Chaque projet commence par une conversation. Je définis avec vous l'histoire à raconter, puis je m'occupe du tournage, du montage, de l'étalonnage et du son.</p>
  <p>Le nom vient d'une idée simple : un instant passe vite. Le film permet de le retrouver.</p>
  <p style="color:var(--grey)">Texte à remplacer par votre propre parcours : formation, matériel, lieux de tournage, références.</p>
  </div><div class="facts">
  <div><b>11 univers</b><span>du mariage au documentaire</span></div>
  <div><b>De A à Z</b><span>tournage, montage, étalonnage, son</span></div>
  <div><b>Partout</b><span>en Belgique et à l'étranger</span></div>
  </div></div></div>`;
}

function contact(sub){
  return `<div class="wrap"><h2>Contact</h2><hr class="rule">
  <div class="two"><form id="f">
  <label>Nom<input name="n" required autocomplete="name"></label>
  <label>E-mail<input name="e" type="email" required autocomplete="email"></label>
  <label>Type de projet<select name="s">${CATEGORIES.map(c=>`<option ${c.id===sub?'selected':''}>${c.name}</option>`).join("")}<option>Autre</option></select></label>
  <label>Votre message<textarea name="m" rows="6" required></textarea></label>
  <button class="cta" type="submit">Envoyer le message</button>
  <p id="note" class="contact-info" role="status"></p></form>
  <div class="contact-info"><p>Une idée, une date, un budget ? Écrivez-moi, je réponds sous 48 heures.</p>
  <p><a href="mailto:${EMAIL}">${EMAIL}</a></p></div></div></div>`;
}

function route(){
  const [path,qs] = (location.hash.slice(2)||"").split("?");
  const [page,arg] = path.split("/");
  const p = page||"home";
  let html;
  if(p==="portfolio") html = portfolio(arg);
  else if(p==="presentation") html = presentation();
  else if(p==="contact") html = contact(new URLSearchParams(qs||"").get("s"));
  else html = home();
  $app.innerHTML = html;
  document.querySelectorAll("nav a").forEach(a=>{
    a.toggleAttribute("aria-current",a.dataset.p===p);
    if(a.dataset.p===p) a.setAttribute("aria-current","page");
  });
  window.scrollTo(0,0);
  document.title = "Time Rabbit Films — " + (p==="home"?"Vidéaste":p[0].toUpperCase()+p.slice(1));
}

function setPlayer(cid,i){
  const c = CATEGORIES.find(x=>x.id===cid), k = i===null ? null : c.clips[i];
  const url = k ? k.url : c.url, label = k ? k.t+" — "+c.name : "Showreel "+c.name;
  const pl = document.getElementById("player");
  pl.innerHTML = video(url,label);
  const b = pl.querySelector(".play[data-src]");
  if(b) b.click();
  document.querySelectorAll(".thumb").forEach((t,n)=>t.setAttribute("aria-pressed",String(n===i)));
  document.getElementById("back").classList.toggle("on",i!==null);
}
document.addEventListener("click",e=>{
  const t = e.target.closest(".thumb");
  if(t){ setPlayer(t.dataset.c,+t.dataset.i); return; }
  if(e.target.closest("#back")){ setPlayer(e.target.closest("#back").dataset.c,null); return; }
  const b = e.target.closest(".play[data-src]");
  if(!b) return;
  const box = b.parentElement;
  box.innerHTML = `<iframe src="${b.dataset.src}?autoplay=1" title="${b.dataset.t}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
});

document.addEventListener("submit",e=>{
  if(e.target.id!=="f") return;
  e.preventDefault();
  const d = new FormData(e.target);
  const body = `${d.get("m")}\n\n— ${d.get("n")} (${d.get("e")})`;
  location.href = `mailto:${EMAIL}?subject=${encodeURIComponent("Projet "+d.get("s"))}&body=${encodeURIComponent(body)}`;
  document.getElementById("note").textContent = "Votre application e-mail s'ouvre pour envoyer le message.";
});

window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
